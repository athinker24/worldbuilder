name: Release

# On a version tag (git tag v1.0.1 && git push --tags) GitHub builds on its own machine and
# attaches the installer + zip to a DRAFT release. Draft: you can download and try the files
# before publishing. No local building and manual uploading, and anyone can see which source
# produced the output.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # can also be run by hand from the Actions tab (a trial build)

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release and attach files
    steps:
      - uses: actions/checkout@v4
        with:
          # The checkout action leaves a GitHub token in .git/config by default, and the very next
          # step is `npm ci`, which runs the install scripts of every dependency on this runner.
          # A compromised package could simply read it — and this job holds contents:write. The
          # release step gets the token explicitly through its own env, so nothing here needs it
          # persisted.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # node:sqlite needs 22+ (the db.ts self-check runs on it too)
          cache: npm

      - run: npm ci

      # Quality gate before the build: a broken release must never ship
      - run: npm run lint
      - run: npm run typecheck
      - run: node src/main/db.ts # database self-check (schema + CRUD + undo + security asserts)
      - run: node check-api.mjs # the renderer's settings loaders against hostile values
      - run: node check-corrupt.mjs # 600 damaged .world files; the app must survive every one

      # The notices file is generated, and a stale one is the failure this whole gate exists to
      # prevent from shipping: adding a dependency and forgetting to regenerate breaks nothing,
      # builds fine, and puts out a release whose licence notices are simply incomplete. Regenerate
      # and require no change. --ignore-cr-at-eol because the runner checks out with CRLF here (see
      # .gitattributes) while the blob is stored LF.
      - name: Third-party notices are up to date
        shell: bash
        run: |
          node gen-notices.mjs
          git diff --exit-code --ignore-cr-at-eol -- legal/THIRD-PARTY-NOTICES.txt \
            || { echo "::error::legal/THIRD-PARTY-NOTICES.txt is stale — run: node gen-notices.mjs"; exit 1; }

      # --publish never is inside the script (package.json), not here, so a local build on a tagged
      # commit behaves the same way. Without it electron-builder sees the git tag, decides on its
      # own to publish, and fails asking for GH_TOKEN — which this job deliberately does not put in
      # the environment. The upload is the step below, where the token is scoped to the one command
      # that needs it. Building and publishing are separate on purpose; the tag is not consent.
      - run: npm run build:win

      # What actually ships, checked by listing the built archive rather than trusting the config
      # that makes it — this is how graphify-out/ (a dump of this codebase's own architecture and
      # security notes) was found shipping inside app.asar despite files: being written specifically
      # to keep that class of thing out. Runs after the build because it has nothing to check
      # before then.
      - run: node check-pack.mjs

      # Upload via GitHub's OWN 'gh' tool (preinstalled on the runner). Avoiding a third-party
      # action is deliberate: any external dependency granted contents:write is supply-chain
      # surface that could write to the repo if compromised.
      # shell: bash — the Windows runner defaults to PowerShell, which does not expand globs (*).
      - name: Create draft release and attach artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME"
          --notes "Setup exe to install; portable zip to run without installing."
          dist/Worldbuilder-*-Setup.exe dist/Worldbuilder-*-portable.zip
