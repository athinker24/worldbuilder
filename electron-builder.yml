appId: com.worldbuilding.app
productName: Dünya
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**' # '!src/*' yalnız DOĞRUDAN çocukları eleyordu — src/main/… paketlenebilirdi
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Geliştirme notları kullanıcıya gitmez: iç mimari + güvenlik önlemlerinin ayrıntılı dökümü,
  # yani saldırgana hazır bir yol haritası. README.txt kullanıcı içindir, o kalır.
  - '!{CLAUDE.md,DURUM.md}'
asarUnpack:
  - resources/**
win:
  executableName: Dünya
  target:
    - nsis
    - portable
# .dunya çift tıkla açılır (yalnız NSIS kurulumu kaydeder; portable/dev kaydedemez — Windows sınırı)
fileAssociations:
  - ext: dunya
    name: Dünya
    description: Dünya worldbuilding dosyası
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
