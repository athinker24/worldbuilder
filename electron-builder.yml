appId: com.worldbuilding.app
productName: Worldbuilder
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**' # '!src/*' only excluded DIRECT children — src/main/… could have shipped
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Dev notes never ship to users: a detailed map of the internals + every security
  # mitigation, i.e. a ready-made roadmap for an attacker. (README.md is excluded above.)
  - '!{CLAUDE.md,DURUM.md,HANDOFF.md,AGENTS.md,TANITIM.md}'
asarUnpack:
  - resources/**
# Electron fuses: flags flipped in the binary itself, so they cannot be turned back on by an
# environment variable or a command line. Each closes a way to make OUR signed-looking exe run
# somebody else's code.
#   runAsNode / nodeOptions / nodeCliInspect — without these, ELECTRON_RUN_AS_NODE turns the app
#     into a general Node interpreter, NODE_OPTIONS injects a require at startup, and --inspect
#     attaches a debugger to the main process, which is the one with filesystem access.
#   onlyLoadAppFromAsar + embeddedAsarIntegrityValidation — the app may only run from the asar,
#     and the asar's hash is embedded in the exe, so editing app.asar makes the app refuse to
#     start instead of running the edit. This is the answer to "anyone who can write to the
#     install folder owns the app", which matters most for the portable build, since it lives
#     wherever the user dropped it rather than behind an admin prompt.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
win:
  executableName: Worldbuilder
  # Artifact names stay ASCII: non-ASCII characters turn into percent-encoding in GitHub download links.
  # This name applies to the ZIP; NSIS overrides its own below.
  artifactName: Worldbuilder-${version}-portable.${ext}
  target:
    - nsis
    # ZIP REPLACED electron-builder's 'portable' target: portable was a self-extracting exe
    # that unpacked ~200 MB into %TEMP% on every launch and ran from there. Startup was slow,
    # temp folders piled up, and crucially the .dunya double-click association BROKE:
    # index.ts writes process.execPath into the registry, and under portable that was a
    # vanishing temp path. With a ZIP the exe stays where the user put it → association works.
    - zip
# .dunya opens on double click. The NSIS installer registers the association itself; from the
# ZIP the app writes its current exe path into HKCU on every launch (see index.ts) — so it is
# found even after being moved.
fileAssociations:
  - ext: world
    name: Worldbuilder
    description: Worldbuilder world file
  # Everything saved before the rename. Registered so those files keep opening on a
  # double click; the app itself only ever writes .world now.
  - ext: dunya
    name: Worldbuilder
    description: Worldbuilder world file (old extension)
nsis:
  artifactName: Worldbuilder-${version}-Setup.${ext}
  # A wizard opens and asks for the install folder (not a one-click silent install)
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false # no admin rights — installs into the user's own profile
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false # the data folder is the user's — NEVER deleted on uninstall
npmRebuild: false
