appId: com.worldbuilding.app
productName: Worldbuilder
# No auto-update: the app never calls autoUpdater (grep confirms it), and PRIVACY.txt promises no
# update check. Without this, electron-builder infers a GitHub publish target from the git remote
# and writes resources/app-update.yml anyway — an inert file naming the repo, sitting inside an app
# whose whole claim is that it contacts nothing. publish: null stops it being generated at all.
publish: null
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**' # '!src/*' only excluded DIRECT children — src/main/… could have shipped
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Dev notes never ship to users: a detailed map of the internals + every security
  # mitigation, i.e. a ready-made roadmap for an attacker. (README.md is excluded above.)
  # (The guidance that moved out of CLAUDE.md is covered too: the skills sit under `.claude/`
  # and `src/`, both excluded elsewhere in this list.)
  - '!{CLAUDE.md,HANDOFF.md,AGENTS.md}'
  # The renderer-side check harness. It lives at the repo ROOT, which the excludes above do not
  # cover — everything not named here ships. Harmless in itself, but a test that stubs the IPC
  # bridge is a description of the bridge, and nothing that exists for development belongs in the
  # app users get. Same rule as the dev CSP widening.
  - '!check-api.mjs'
  - '!check-corrupt.mjs'
  - '!check-pack.mjs'
  # The notice GENERATOR is development tooling and never ships; its OUTPUT does, but as an
  # extraFile beside the exe, so keeping all four out of the asar leaves one copy rather than two.
  # A licence the user cannot find has not been given to them, and one buried inside an archive
  # they have no tool to open is exactly that.
  - '!gen-notices.mjs'
  - '!legal/**'
  # Agent and editor configuration. Nothing above covers the repo root, and electron-builder ships
  # whatever it is not told to leave out — so `.claude/`, `.agents/`, `.mcp.json` and
  # `skills-lock.json` were going out INSIDE every copy of the app, and
  # `.claude/settings.local.json` carries absolute paths with the account name in them. The log has
  # a whole gate about not leaking that name; shipping it in the binary is the same leak, in every
  # copy, permanently. Found by listing the built asar, not by reading this file — which is the
  # only way this class of mistake ever shows up.
  - '!.claude'
  - '!.agents'
  - '!.mcp.json'
  - '!skills-lock.json'
  # graphify's derived output: an AST + semantic index of this codebase, including the security
  # gates extracted from CLAUDE.md/HANDOFF.md (Gate 1…41) as named concepts. It is gitignored, which
  # is why it never showed up in a git-based review of what ships — .gitignore has no effect on
  # electron-builder, which packs whatever it is not told to omit. Same class of leak as .claude
  # above, found the same way: by listing the built asar rather than reading this file.
  - '!graphify-out'
asarUnpack:
  - resources/**
# The legal/info documents, as FILES in a `legal/` folder beside the exe rather than inside the
# asar. Both distributions get them: NSIS copies the folder into the install directory, and the ZIP
# contains it next to Worldbuilder.exe — which is the only way the portable build can carry terms at
# all, having no installer to show a page in. LICENSE.electron.txt and LICENSES.chromium.html stay
# at the install root: electron-builder places those itself and does not offer a destination for
# them, so this is the boundary of what we control the layout of.
#
# extraFiles, not extraResources: resources/ is an implementation detail nobody opens, and a licence
# nobody can find has not been given to anyone. Help ▸ opens these same files from disk (openLegal,
# index.ts). The string form (not {from, to}) preserves the `legal/` prefix in the output, matching
# the source layout — so the source path and the shipped path are the same path.
extraFiles:
  - legal/TERMS.txt
  - legal/PRIVACY.txt
  - legal/THIRD-PARTY-NOTICES.txt
  - legal/ALPHA-README.txt
# Electron fuses: flags flipped in the binary itself, so they cannot be turned back on by an
# environment variable or a command line. Each closes a way to make OUR signed-looking exe run
# somebody else's code.
#   runAsNode / nodeOptions / nodeCliInspect — without these, ELECTRON_RUN_AS_NODE turns the app
#     into a general Node interpreter, NODE_OPTIONS injects a require at startup, and --inspect
#     attaches a debugger to the main process, which is the one with filesystem access.
#   onlyLoadAppFromAsar + embeddedAsarIntegrityValidation — the app may only run from the asar,
#     and the asar's hash is embedded in the exe, so editing app.asar makes the app refuse to
#     start instead of running the edit. This is the answer to "anyone who can write to the
#     install folder owns the app", which matters most for the portable build, since it lives
#     wherever the user dropped it rather than behind an admin prompt.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
win:
  executableName: Worldbuilder
  # Artifact names stay ASCII: non-ASCII characters turn into percent-encoding in GitHub download links.
  # This name applies to the ZIP; NSIS overrides its own below.
  artifactName: Worldbuilder-${version}-portable.${ext}
  target:
    - nsis
    # ZIP REPLACED electron-builder's 'portable' target: portable was a self-extracting exe
    # that unpacked ~200 MB into %TEMP% on every launch and ran from there. Startup was slow,
    # temp folders piled up, and crucially the .dunya double-click association BROKE:
    # index.ts writes process.execPath into the registry, and under portable that was a
    # vanishing temp path. With a ZIP the exe stays where the user put it → association works.
    - zip
# .dunya opens on double click. The NSIS installer registers the association itself; from the
# ZIP the app writes its current exe path into HKCU on every launch (see index.ts) — so it is
# found even after being moved.
fileAssociations:
  - ext: world
    name: Worldbuilder
    description: Worldbuilder world file
  # Everything saved before the rename. Registered so those files keep opening on a
  # double click; the app itself only ever writes .world now.
  - ext: dunya
    name: Worldbuilder
    description: Worldbuilder world file (old extension)
nsis:
  artifactName: Worldbuilder-${version}-Setup.${ext}
  # The terms, as a page the installer will not go past until it is accepted. This is the one
  # moment the user is guaranteed to be looking, and it is why the file is written to be read
  # rather than scrolled past. The ZIP has no equivalent moment, which is what extraFiles and the
  # Help menu are for.
  license: legal/TERMS.txt
  # A wizard opens and asks for the install folder (not a one-click silent install)
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false # no admin rights — installs into the user's own profile
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false # the data folder is the user's — NEVER deleted on uninstall
npmRebuild: false
